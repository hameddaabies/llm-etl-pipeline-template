name: tests

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Ruff never imports the project, so install only the linter, with the
      # version read from requirements.txt to keep the pin single-sourced.
      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements.txt)"
      - name: Lint
        run: python -m ruff check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The suite mocks the OpenAI client, so no API key or network access is needed.
      - name: Run tests
        run: python -m pytest -q
